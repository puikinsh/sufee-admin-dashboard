<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>Login - Sufee Admin</title>
        <meta name="description" content="Login - Sufee Admin Dashboard" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <div data-partial="head-common"></div>
    </head>

    <body class="auth-page" data-bs-theme="light">
        <main class="auth-card">
            <header class="auth-hero">
                <img class="auth-logo" src="./images/sufee-logo.svg" alt="Sufee Admin Logo" />
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your account</p>
            </header>

            <div class="auth-body">
                <form id="loginForm" novalidate>
                    <div class="form-floating">
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Email address"
                            required
                        />
                        <label for="email">Email address</label>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>

                    <div class="form-floating position-relative">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Password"
                            required
                        />
                        <label for="password">Password</label>
                        <button
                            type="button"
                            id="togglePassword"
                            class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2 p-1 text-secondary"
                            aria-label="Toggle password visibility"
                            style="z-index: 5"
                        >
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                        <div class="invalid-feedback">Password is required.</div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe" />
                            <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>
                        <a href="./pages-forget.html" class="small fw-semibold text-decoration-none">
                            Forgot password?
                        </a>
                    </div>

                    <button type="submit" class="auth-btn">Sign In</button>

                    <div class="auth-divider">Or continue with</div>

                    <div class="auth-social-row">
                        <a href="#" class="auth-social-btn" data-provider="facebook">
                            <i class="fab fa-facebook-f"></i>
                            Facebook
                        </a>
                        <a href="#" class="auth-social-btn" data-provider="x">
                            <i class="fab fa-x-twitter"></i>
                            X
                        </a>
                        <a href="#" class="auth-social-btn" data-provider="google">
                            <i class="fab fa-google"></i>
                            Google
                        </a>
                    </div>
                </form>
            </div>

            <footer class="auth-footer">
                Don't have an account?
                <a href="./page-register.html">Sign up</a>
            </footer>
        </main>

        <!-- Scripts -->
        <script type="module" src="/main.js"></script>
        <script type="module">
            // Login form: password visibility toggle + minimal validation.
            // Demo only — replace with your real auth flow.
            document.addEventListener('DOMContentLoaded', () => {
                const form = document.getElementById('loginForm');
                const email = document.getElementById('email');
                const password = document.getElementById('password');
                const toggleBtn = document.getElementById('togglePassword');
                const toggleIcon = document.getElementById('toggleIcon');
                const submitBtn = form.querySelector('button[type="submit"]');

                toggleBtn.addEventListener('click', () => {
                    const isText = password.type === 'text';
                    password.type = isText ? 'password' : 'text';
                    toggleIcon.classList.toggle('fa-eye', isText);
                    toggleIcon.classList.toggle('fa-eye-slash', !isText);
                });

                const showError = (input, msg) => {
                    input.classList.add('is-invalid');
                    input.classList.remove('is-valid');
                    const fb = input.parentElement.querySelector('.invalid-feedback');
                    if (fb) fb.textContent = msg;
                };

                const clearError = input => {
                    input.classList.remove('is-invalid');
                    input.classList.add('is-valid');
                };

                const validateEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

                form.addEventListener('submit', e => {
                    e.preventDefault();
                    let valid = true;

                    if (!email.value.trim() || !validateEmail(email.value)) {
                        showError(email, 'Please enter a valid email.');
                        valid = false;
                    } else {
                        clearError(email);
                    }

                    if (password.value.length < 6) {
                        showError(password, 'Password must be at least 6 characters.');
                        valid = false;
                    } else {
                        clearError(password);
                    }

                    if (!valid) return;

                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Signing in…';
                    setTimeout(() => {
                        // Replace with your real auth call.
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Sign In';
                    }, 1200);
                });
            });
        </script>
    </body>
</html>
