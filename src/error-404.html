<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>404 - Page Not Found | Sufee Admin</title>
        <meta name="description" content="Page Not Found - Sufee Admin Dashboard" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <div data-partial="head-common"></div>
    </head>

    <body class="error-page" data-bs-theme="light">
        <main class="error-card">
            <div class="error-illustration">
                <i class="fas fa-search"></i>
            </div>

            <div class="error-number">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                The page you're looking for doesn't exist or has moved. Check the URL or head back to the dashboard.
            </p>

            <div class="error-suggestions">
                <h5>
                    <i class="fas fa-lightbulb me-1"></i>
                    Things to try:
                </h5>
                <ul>
                    <li>Double-check the URL for typos</li>
                    <li>
                        Go back to the
                        <a href="index.html">dashboard homepage</a>
                    </li>
                    <li>Use search to find what you need</li>
                </ul>
            </div>

            <div class="error-actions">
                <a href="index.html" class="btn-error btn-error-primary">
                    <i class="fas fa-home"></i>
                    Back to Dashboard
                </a>
                <button type="button" class="btn-error btn-error-secondary" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i>
                    Go Back
                </button>
            </div>
        </main>

        <script type="module" src="/main.js"></script>
    </body>
</html>
