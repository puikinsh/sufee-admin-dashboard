<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>Forgot Password - Sufee Admin</title>
        <meta name="description" content="Reset your password — Sufee Admin Dashboard" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <div data-partial="head-common"></div>
    </head>

    <body class="auth-page">
        <main class="auth-card">
            <header class="auth-hero">
                <div class="auth-icon-circle">
                    <i class="fas fa-key"></i>
                </div>
                <h1 class="auth-title">Forgot Password?</h1>
                <p class="auth-subtitle">We'll send you reset instructions</p>
            </header>

            <div class="auth-body">
                <p class="auth-description">
                    Enter your email address and we'll send you a link to reset your password.
                </p>

                <div class="auth-message is-success" id="successMessage">
                    <i class="fas fa-check-circle me-2"></i>
                    <strong>Email sent!</strong>
                    Check your inbox for password reset instructions.
                </div>

                <div class="auth-message is-error" id="errorMessage">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span id="errorText">Something went wrong.</span>
                </div>

                <form id="forgotForm" novalidate>
                    <div class="form-floating">
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Email address"
                            required
                        />
                        <label for="email">Email address</label>
                        <div class="invalid-feedback">Please enter a valid email.</div>
                    </div>

                    <button type="submit" class="auth-btn" id="submitBtn">
                        <i class="fas fa-paper-plane me-2"></i>
                        Send reset link
                    </button>
                </form>
            </div>

            <footer class="auth-footer">
                Remembered it?
                <a href="./page-login.html">Back to sign in</a>
            </footer>
        </main>

        <script type="module" src="/main.js"></script>
        <script type="module">
            document.addEventListener('DOMContentLoaded', () => {
                const form = document.getElementById('forgotForm');
                const email = document.getElementById('email');
                const submitBtn = document.getElementById('submitBtn');
                const successMessage = document.getElementById('successMessage');
                const errorMessage = document.getElementById('errorMessage');
                const errorText = document.getElementById('errorText');

                const validateEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

                form.addEventListener('submit', e => {
                    e.preventDefault();
                    successMessage.classList.remove('is-visible');
                    errorMessage.classList.remove('is-visible');

                    if (!email.value.trim() || !validateEmail(email.value)) {
                        email.classList.add('is-invalid');
                        errorText.textContent = 'Please enter a valid email address.';
                        errorMessage.classList.add('is-visible');
                        return;
                    }
                    email.classList.remove('is-invalid');

                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending…';

                    // Replace with your real password-reset API call.
                    setTimeout(() => {
                        successMessage.classList.add('is-visible');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send reset link';
                        form.reset();
                        email.classList.remove('is-valid');
                    }, 1200);
                });

                email.addEventListener('input', () => {
                    email.classList.remove('is-invalid');
                });
            });
        </script>
    </body>
</html>
