<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>Google Maps - Sufee Admin</title>
        <meta name="description" content="Google Maps integration - Sufee Admin Dashboard" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <div data-partial="head-common"></div>
    </head>

    <body class="sufee-dashboard" data-page="maps-gmap">
        <!-- Main Container -->
        <div class="d-flex min-vh-100">
            <div data-partial="sidebar" data-partial-replace="true"></div>

            <!-- Main Content Area -->
            <div class="main-content flex-grow-1">
                <div data-partial="header" data-partial-replace="true"></div>

                <div data-breadcrumb data-breadcrumb-title="Google Maps" data-breadcrumb-path="Dashboard|Maps"></div>

                <!-- Main Content -->
                <main class="content-area p-4">
                    <div class="container-fluid">
                        <div class="row g-4">
                            <div class="col-lg-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="mb-0">Basic Map</h4>
                                    </div>
                                    <div class="card-body">
                                        <div class="gmap" id="basic-map" data-gmap="basic" style="height: 400px"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="mb-0">Map with Markers</h4>
                                    </div>
                                    <div class="card-body">
                                        <div class="gmap" id="map-2" data-gmap="markers" style="height: 400px"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="mb-0">Geometry overlays</h4>
                                    </div>
                                    <div class="card-body">
                                        <div class="gmap" id="map-3" data-gmap="geometry" style="height: 400px"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="mb-0">Elevation locations</h4>
                                    </div>
                                    <div class="card-body">
                                        <div class="gmap" id="map-4" data-gmap="elevation" style="height: 400px"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="mb-0">Geolocation</h4>
                                    </div>
                                    <div class="card-body">
                                        <div
                                            class="gmap"
                                            id="map-5"
                                            data-gmap="geolocation"
                                            style="height: 400px"
                                        ></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="mb-0">Styled Map (Night Mode)</h4>
                                    </div>
                                    <div class="card-body">
                                        <div class="gmap" id="map-6" data-gmap="styled" style="height: 400px"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="mb-0">Traffic & Transit Layers</h4>
                                    </div>
                                    <div class="card-body">
                                        <div class="gmap" id="map-7" data-gmap="traffic" style="height: 400px"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="mb-0">Map events</h4>
                                    </div>
                                    <div class="card-body">
                                        <div class="gmap" id="map-8" data-gmap="events" style="height: 400px"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <div data-partial="scripts-common"></div>

        <!-- Google Maps: add your API key in src/config/maps.config.js (static previews are shown until then).
             The maps are built by scripts/components/gmaps.js, loaded for every [data-gmap] element. -->
        <script type="module" src="/main.js"></script>
    </body>
</html>
